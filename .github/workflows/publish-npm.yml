name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish swarm-rd-orchestrator-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11 (Trusted Publishing needs 11.5.1 or newer)
        run: npm install -g npm@11

      - name: Syntax check the wrapper
        run: node --check bin/cli.js
        working-directory: npm

      - name: Publish to npm
        run: npm publish --access public
        working-directory: npm
