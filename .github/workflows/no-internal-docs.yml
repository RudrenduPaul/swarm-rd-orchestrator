name: No internal docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail on internal-only filenames
        run: |
          set -e
          hits=$(find . -type f \( -iname 'CLAUDE.md' -o -iname 'TODOS.md' -o -iname 'BRANCH_PROTECTION.md' \) -not -path './.git/*')
          if [ -n "$hits" ]; then
            echo "Found internal-only files that must not be public:"
            echo "$hits"
            exit 1
          fi

      - name: Fail on internal review-process references
        run: |
          set -e
          pattern='CEO review|office-?hours|eng-?review|devex review|CSO review|CSO threat-?model|/oss-[0-9]+-[a-z-]+|/plan-eng-review|/review finding|Reviewer Concern|viability score|fundrais|investor-?outreach|Show HN draft|hype-?seed'
          hits=$(grep -rinE "$pattern" --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ . || true)
          if [ -n "$hits" ]; then
            echo "Found references to internal review processes or strategy terms:"
            echo "$hits"
            exit 1
          fi
