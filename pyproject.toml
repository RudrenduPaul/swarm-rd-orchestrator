[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-rd-orchestrator-cli"
version = "0.0.3"
description = "Ray-native context/memory sharing for parallel research agents, with an agent-native CLI and MCP server (Milestone 1 spike)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "ray", "multi-agent", "agent-orchestration", "mcp", "model-context-protocol",
    "context-sharing", "memory-sharing", "research-agents", "sqlite", "cli",
]
authors = [
    { name = "Rudrendu Paul" },
    { name = "Sourav Nandy" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "ray>=2.56",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]
mcp = ["mcp>=1.0"]

[project.scripts]
swarm-rd-cli = "cli:main"

[tool.setuptools]
py-modules = ["event_log", "spike", "cli", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["."]
